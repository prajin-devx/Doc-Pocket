<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DocPocket — Personal PDF Vault</title>
    <meta name="description" content="DocPocket is a fast, offline-first personal PDF vault. Organize, search, annotate, and view documents securely on-device with IndexedDB." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DocPocket" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- OpenGraph / Social -->
    <meta property="og:site_name" content="DocPocket" />
    <meta property="og:title" content="DocPocket — Personal PDF Vault" />
    <meta property="og:description" content="Fast, private personal PDF vault with on-device IndexedDB storage and Google Drive cloud sync." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocPocket — Personal PDF Vault" />
    <meta name="twitter:description" content="Fast, private personal PDF vault with on-device IndexedDB storage and Google Drive cloud sync." />
    <meta name="keywords" content="PDF vault, offline PDF viewer, personal document manager, college notes organizer, timetable PDF, student vault, IndexedDB PDF" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DocPocket",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5 IndexedDB.",
      "description": "DocPocket is a fast, offline-first personal PDF vault and document organizer with on-device IndexedDB storage, high-fidelity PDF reading, collections, and Google Drive sync.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
